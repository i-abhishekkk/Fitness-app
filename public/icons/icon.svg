<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ring" x1="80" y1="80" x2="432" y2="432" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b27cff"/>
      <stop offset="1" stop-color="#ff4b36"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="256" r="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff4b36" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff4b36" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#07080c"/>

  <circle cx="256" cy="256" r="150" fill="url(#glow)"/>

  <!-- outer aura ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="34" stroke-linecap="round"/>

  <!-- inner accent ring, offset like the app's stacked rings -->
  <circle cx="256" cy="256" r="96" fill="none" stroke="#22d3c7" stroke-width="16" stroke-opacity="0.85" stroke-linecap="round" stroke-dasharray="430" stroke-dashoffset="120"/>

  <!-- core -->
  <circle cx="256" cy="256" r="30" fill="#f6f5f3"/>
</svg>
