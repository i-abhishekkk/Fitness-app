<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GOD MODE — Abhishek</title>
  <script type="text/javascript">
    // GitHub Pages is a static host — a direct request/reload for a client-side
    // route like /Fitness-app/today has no matching file, so GH serves this 404
    // page instead. Redirect it back to index.html with the intended path packed
    // into a query string; index.html's inline script unpacks it before React
    // Router mounts, so the app lands back on the right route.
    // pathSegmentsToKeep = 1 keeps the "/Fitness-app" repo-name segment (this is
    // a GitHub Pages *project* page, not a user/org root page).
    var pathSegmentsToKeep = 1
    var l = window.location
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    )
  </script>
</head>
<body></body>
</html>
