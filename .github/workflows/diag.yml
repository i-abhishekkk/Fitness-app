name: Diag Coach
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_WEB_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          WORKER_URL: ${{ secrets.VITE_AI_WORKER_URL }}
        run: node scripts/diag-coach.mjs
