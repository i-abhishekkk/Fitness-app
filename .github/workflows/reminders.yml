name: Send Reminder

# All times below are IST (UTC+5:30) — cron itself has no timezone, so every entry is
# commented with its real-world time. The mapping from each expression to its actual
# notification title/body lives in scripts/reminder-schedule.mjs (keyed by the exact
# cron string, since GitHub passes it back as `github.event.schedule`) — keep the two
# files in sync when adding/changing a time.
on:
  schedule:
    # Weekly body check-in
    - cron: '30 3 * * 0'   # Sun 9:00 AM — log weight + measurements

    # Water — 6x/day
    - cron: '30 1 * * *'   # 7:00 AM
    - cron: '0 4 * * *'    # 9:30 AM
    - cron: '30 6 * * *'   # 12:00 PM
    - cron: '0 9 * * *'    # 2:30 PM
    - cron: '30 11 * * *'  # 5:00 PM
    - cron: '30 14 * * *'  # 8:00 PM

    # Supplements
    - cron: '30 2 * * *'   # 8:00 AM — Collagen
    - cron: '45 2 * * *'   # 8:15 AM — Creatine
    - cron: '30 4 * * *'   # 10:00 AM — Multivitamin + Fish Oil
    - cron: '30 8 * * *'   # 2:00 PM — Vitamin B12
    - cron: '0 17 * * *'   # 10:30 PM — Magnesium (ZMA)
    - cron: '45 8 * * 0'   # Sun 2:15 PM — Vitamin D3

    # Meals — weekday (Mon–Fri)
    - cron: '50 0 * * 1-5' # 6:20 AM — Meal 1
    - cron: '15 4 * * 1-5' # 9:45 AM — Meal 2
    - cron: '0 8 * * 1-5'  # 1:30 PM — Meal 3
    - cron: '0 14 * * 1-5' # 7:30 PM — Meal 4

    # Meals — Saturday
    - cron: '0 2 * * 6'    # 7:30 AM — Meal 1
    - cron: '30 6 * * 6'   # 12:00 PM — Meal 2
    - cron: '0 9 * * 6'    # 2:30 PM — Meal 3
    - cron: '0 14 * * 6'   # 7:30 PM — Meal 4

    # Meals — Sunday
    - cron: '45 3 * * 0'   # 9:15 AM — Meal 1
    - cron: '0 5 * * 0'    # 10:30 AM — Meal 2
    - cron: '0 8 * * 0'    # 1:30 PM — Meal 3
    - cron: '0 15 * * 0'   # 8:30 PM — Meal 4

  workflow_dispatch:
    inputs:
      title:
        description: Notification title (manual test run only)
        default: 'GOD MODE — test'
      body:
        description: Notification body (manual test run only)
        default: 'This is a manual test reminder.'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/send-reminder.mjs "${{ inputs.title }}" "${{ inputs.body }}"
