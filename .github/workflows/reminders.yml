name: Send Reminder (manual)

# The actual reminder schedule moved to Cloudflare Workers Cron Triggers (see
# worker/wrangler.toml + worker/src/reminders.ts) — GitHub Actions' `schedule` event was
# observed firing 4-5 hours late (a documented "best effort" limitation, not something
# fixable from this side) and isn't reliable enough for time-sensitive alerts. This
# workflow now exists only as a manual "send a one-off test/custom push" tool.
on:
  workflow_dispatch:
    inputs:
      title:
        description: Notification title
        default: 'GOD MODE — test'
      body:
        description: Notification body
        default: 'This is a manual test reminder.'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: node scripts/send-reminder.mjs "${{ inputs.title }}" "${{ inputs.body }}"
